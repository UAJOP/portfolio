name: Repair preflight cleanup

on:
  push:
    branches:
      - qa/site-preflight
    paths:
      - .github/workflows/repair-preflight-cleanup.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out cleanup branch
        uses: actions/checkout@v5
        with:
          ref: qa/site-preflight
          fetch-depth: 0

      - name: Repair Joyday preview markup
        run: python3 scripts/repair_preflight_cleanup.py

      - name: Validate patch formatting
        run: git diff --check

      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add joyday-paint.html
          if git diff --cached --quiet; then
            echo "No repair changes were needed."
            exit 0
          fi
          git commit -m "Repair Joyday preview image markup"
          git push origin HEAD:qa/site-preflight
