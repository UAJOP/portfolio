name: Site Preflight

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-audit:
    name: Content, HTML, accessibility and Lighthouse
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install audit tools
        run: npm install --no-audit --no-fund

      - name: Prepare reports directory
        run: mkdir -p qa-results

      - name: Validate HTML
        continue-on-error: true
        run: npm run qa:html 2>&1 | tee qa-results/html-validation.txt

      - name: Check English and Turkish spelling
        continue-on-error: true
        run: npm run qa:spelling 2>&1 | tee qa-results/spelling.txt

      - name: Start local site
        run: |
          python3 -m http.server 4173 > qa-results/local-server.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/index.html > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat qa-results/local-server.log
          exit 1

      - name: Audit accessibility on mobile viewport
        continue-on-error: true
        run: npm run qa:a11y -- --json > qa-results/accessibility.json 2> qa-results/accessibility-errors.txt

      - name: Run Lighthouse CI
        continue-on-error: true
        run: npm run qa:lighthouse 2>&1 | tee qa-results/lighthouse.txt

      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-preflight-reports
          path: qa-results/
          if-no-files-found: warn
          retention-days: 14

  link-audit:
    name: Broken links
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Scan HTML and Markdown links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --verbose
            --no-progress
            --root-dir "${{ github.workspace }}"
            './**/*.html'
            './**/*.md'
          fail: false
          jobSummary: true
