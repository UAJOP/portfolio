name: Site Preflight

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-audit:
    name: Content, HTML, accessibility and Lighthouse
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install audit tools
        run: npm ci --no-audit --no-fund

      - name: Prepare reports directory
        run: mkdir -p qa-results

      # AUTHORITATIVE, BLOCKING: `npm run qa` is the repository correctness
      # contract (data, i18n, clean routes incl. the HTTP smoke test against a
      # GitHub Pages-shaped server, foundation, projects, SEO, runtime,
      # performance, CSS, Master 2 design + token parity, static a11y,
      # recruiter UX, analytics, automation, JS, portfolio/AJOOP guards, assets,
      # links, HTML and spelling). CI runs the chain itself instead of restating
      # its members, so a gate added to package.json can never be skipped here.
      # Pa11y and Lighthouse below are the separate browser/runtime layer.
      - name: Repository QA contract (npm run qa)
        shell: bash
        run: |
          set -o pipefail
          npm run qa 2>&1 | tee qa-results/qa.txt

      - name: Build React migration foundation
        run: |
          set -o pipefail
          npm run build:react 2>&1 | tee qa-results/react-build.txt

      - name: Check React foundation
        run: |
          set -o pipefail
          npm run qa:react 2>&1 | tee qa-results/react-foundation.txt

      - name: Build mixed production artifact
        run: |
          set -o pipefail
          npm run build:site 2>&1 | tee qa-results/site-build.txt

      - name: Audit emitted production artifact
        run: |
          set -o pipefail
          npm run qa:m3:artifact 2>&1 | tee qa-results/emitted-artifact.txt

      - name: Start local site
        run: |
          python3 -m http.server 4173 --directory dist-site > qa-results/local-server.log 2>&1 &
          echo $! > qa-results/local-server.pid
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat qa-results/local-server.log
          exit 1

      - name: Audit accessibility on mobile viewport
        run: npm run qa:a11y -- --json > qa-results/accessibility.json 2> qa-results/accessibility-errors.txt

      - name: Start React preview server
        run: |
          npm run preview:react > qa-results/react-preview-server.log 2>&1 &
          echo $! > qa-results/react-preview-server.pid
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:4174/react-preview/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat qa-results/react-preview-server.log
          exit 1

      - name: Audit React preview accessibility
        run: |
          set -o pipefail
          npm run qa:a11y:react 2>&1 | tee qa-results/react-accessibility.txt

      - name: Run Lighthouse CI
        continue-on-error: true
        run: |
          set -o pipefail
          npm run qa:lighthouse 2>&1 | tee qa-results/lighthouse.txt

      - name: Summarize Lighthouse scores
        if: always()
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const directory = '.lighthouseci';
          const score = (category) => category && typeof category.score === 'number'
            ? Math.round(category.score * 100)
            : null;
          const metric = (audit, digits = 0) => audit && typeof audit.numericValue === 'number'
            ? Number(audit.numericValue.toFixed(digits))
            : null;
          const files = fs.existsSync(directory)
            ? fs.readdirSync(directory).filter((file) => /^lhr-.*\.json$/.test(file))
            : [];
          const summary = files.map((file) => {
            const report = JSON.parse(fs.readFileSync(path.join(directory, file), 'utf8'));
            const categories = report.categories || {};
            const audits = report.audits || {};
            const pageUrl = report.finalUrl || report.requestedUrl || file;
            return {
              page: pageUrl.startsWith('http') ? new URL(pageUrl).pathname : pageUrl,
              performance: score(categories.performance),
              accessibility: score(categories.accessibility),
              bestPractices: score(categories['best-practices']),
              seo: score(categories.seo),
              fcpMs: metric(audits['first-contentful-paint']),
              lcpMs: metric(audits['largest-contentful-paint']),
              tbtMs: metric(audits['total-blocking-time']),
              cls: metric(audits['cumulative-layout-shift'], 3)
            };
          }).sort((a, b) => a.page.localeCompare(b.page));
          fs.writeFileSync('qa-results/lighthouse-summary.json', JSON.stringify(summary, null, 2));
          console.table(summary);
          NODE

      - name: Stop local servers
        if: always()
        run: |
          for pidfile in qa-results/local-server.pid qa-results/react-preview-server.pid; do
            if [ ! -f "$pidfile" ]; then
              continue
            fi
            pid="$(cat "$pidfile")"
            if kill -0 "$pid" 2>/dev/null; then
              kill "$pid" 2>/dev/null || true
              for attempt in {1..10}; do
                kill -0 "$pid" 2>/dev/null || break
                sleep 1
              done
              kill -9 "$pid" 2>/dev/null || true
            fi
            wait "$pid" 2>/dev/null || true
          done

      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-preflight-reports
          path: qa-results/
          if-no-files-found: warn
          retention-days: 14

  link-audit:
    name: Broken links
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Scan HTML and Markdown links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --verbose
            --no-progress
            --root-dir "${{ github.workspace }}"
            './**/*.html'
            './**/*.md'
          fail: false
          jobSummary: true

  deploy-pages:
    name: Build and deploy bounded Pages artifact
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - quality-audit
      - link-audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build bounded Pages artifact
        run: npm run build:site

      - name: Audit exact deploy artifact with the complete Master 3 gate
        run: npm run qa:m3:artifact

      - name: Verify bounded Pages artifact
        run: npm run qa:site:artifact

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist-site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
